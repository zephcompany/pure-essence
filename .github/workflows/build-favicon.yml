name: Build favicon

on:
  push:
    paths:
      - 'assets/FLAV ICO.jpg'
      - '.github/workflows/build-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Convert uploaded JPG to favicon PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          src = Image.open('assets/FLAV ICO.jpg').convert('RGBA')
          side = min(src.size)
          left = (src.width - side) // 2
          top = (src.height - side) // 2
          src = src.crop((left, top, left + side, top + side))
          src = src.resize((512, 512), Image.Resampling.LANCZOS)
          src.save('assets/favicon.png', optimize=True)
          src.resize((180, 180), Image.Resampling.LANCZOS).save('assets/apple-touch-icon.png', optimize=True)
          PY
      - name: Commit generated favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon.png assets/apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Generate browser favicon from FLAV ICO.jpg"
          git push
